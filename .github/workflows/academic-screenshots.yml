name: JUSTEC - Documentação Acadêmica
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Capture academic journeys
        run: |
          mkdir -p screenshots
          cat > capture.cjs <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs'), assert=require('node:assert/strict'), crypto=require('crypto');
          (async()=>{
           const browser=await chromium.launch();
           const url='https://justec-bank.vercel.app/';
           const report=[];
           for(const [device,viewport] of Object.entries({mobile:{width:390,height:844},desktop:{width:1440,height:900}})){
            const context=await browser.newContext({viewport,deviceScaleFactor:2,locale:'pt-BR',isMobile:device==='mobile',hasTouch:device==='mobile',reducedMotion:'reduce'});
            const page=await context.newPage();page.setDefaultTimeout(7000);
            const dir='screenshots/'+device;fs.mkdirSync(dir,{recursive:true});
            const seen=new Set();
            const click=s=>page.locator(s).filter({visible:true}).first().click();
            const go=async name=>{await page.evaluate(n=>navigateTo(n),name);await page.locator('#screen-'+name).waitFor({state:'visible'});};
            const reset=async()=>{const r=await page.goto(url,{waitUntil:'domcontentloaded'});assert(r&&r.ok());await page.waitForFunction(()=>typeof navigateTo==='function');};
            async function shot(name){
             await page.evaluate(()=>document.fonts.ready);await page.waitForTimeout(250);
             const scroll=await page.evaluate(()=>{const e=document.scrollingElement;return {height:e.scrollHeight,view:innerHeight};});
             const count=Math.min(30,Math.max(1,Math.ceil((scroll.height-scroll.view)/(scroll.view*.65))+1));
             for(let n=0;n<count;n++){
              await page.evaluate(y=>window.scrollTo(0,y),Math.round(n*scroll.view*.65));await page.waitForTimeout(100);
              const b=await page.screenshot({animations:'disabled'});const hash=crypto.createHash('sha256').update(b).digest('hex');
              if(seen.has(hash))continue;seen.add(hash);
              const file=dir+'/'+name+'-'+String(n+1).padStart(2,'0')+'.png';fs.writeFileSync(file,b);report.push({device,name,file});
             }
             await page.evaluate(()=>window.scrollTo(0,0));
            }
            async function scenario(name,fn){try{await reset();await fn();report.push({device,name,status:'ok'});}catch(e){report.push({device,name,status:'failed',error:String(e)});console.error(device,name,e.message);}}
            for(const name of ['home','statement','protection','reviews','security','screening','action-post','rights','edu-center'])await scenario(name,async()=>{await go(name);await shot(name);});
            for(const type of ['bank_call','whatsapp','offer'])await scenario('triagem-'+type,async()=>{await go('screening');await click('[onclick="showDiagnosis(\''+type+'\')"]');await page.locator('#app-modal').waitFor({state:'visible'});await shot('triagem-'+type);});
            await scenario('med',async()=>{await go('action-post');await click('[onclick="openMedWizard()"]');await page.locator('#app-modal').waitFor({state:'visible'});await shot('med');});
            async function pix(id,prefix,contextual=false){
             await page.evaluate(()=>openPixFlow());await shot(prefix+'-01-inicio');
             await click('[data-pix-method="recipient"]');await page.selectOption('#pix-recipient',id);await shot(prefix+'-02-destinatario');
             await click('#pix-lookup');await shot(prefix+'-03-consulta');await click('#pix-recipient-next');
             await page.fill('#pix-amount','50,00');if(contextual)await page.check('#pix-context-request');await shot(prefix+'-04-valor');
             await click('#pix-form button[type=submit]');await page.check('#pix-data-confirm');await shot(prefix+'-05-conferencia');await click('[onclick="analyzePix()"]');
            }
            await scenario('pix-seguro',async()=>{await pix('demo-low','pix-seguro');await page.locator('#pix-pause').waitFor({state:'visible'});await shot('pix-seguro-06-pausa');await page.locator('#pix-continue').click({timeout:15000});await shot('pix-seguro-07-senha');await page.fill('#pix-demo-code','0000');await page.check('#pix-demo-confirm');await click('#pix-submit');await page.locator('#pix-result').waitFor({state:'visible'});assert.match(await page.locator('#pix-result-title').innerText(),/sucesso/i);await shot('pix-seguro-08-resultado');await click('#pix-receipt');await shot('pix-seguro-09-comprovante');await go('statement');await shot('pix-seguro-10-extrato');});
            await scenario('pix-suspeito',async()=>{await pix('demo-medium','pix-suspeito');await page.locator('#pix-guard').waitFor({state:'visible'});await shot('pix-suspeito-06-avaliacao');for(const [k,v] of Object.entries({identity:'yes',urgency:'yes',advance:'no',ignore:'no'}))await page.selectOption('#pix-'+k,v);await click('#pix-check-context');await shot('pix-suspeito-07-alerta');});
            await scenario('pix-interrompido',async()=>{await pix('demo-low','pix-interrompido',true);for(const [k,v] of Object.entries({identity:'no',urgency:'yes',advance:'yes',ignore:'no'}))await page.selectOption('#pix-'+k,v);await shot('pix-interrompido-06-respostas');await click('#pix-check-context');await page.locator('#pix-result').waitFor({state:'visible'});assert.match(await page.locator('#pix-result-title').innerText(),/interrompido/i);await shot('pix-interrompido-07-resultado');await go('security');await shot('pix-interrompido-08-historico');});
            await scenario('pix-restrito',async()=>{await pix('demo-high','pix-restrito');await page.locator('#pix-result').waitFor({state:'visible'});await shot('pix-restrito-06-resultado');});
            await scenario('falso-positivo',async()=>{await go('reviews');const card=page.locator('#review-list article').filter({hasText:'falso positivo, retirada interna'});await card.locator('textarea').fill('Contestação fictícia para demonstração acadêmica.');await shot('revisao-01-pedido');for(const [i,label] of ['Solicitar revisão simulada','Simular início da análise','Exibir resultado demonstrativo'].entries()){await card.getByRole('button',{name:label,exact:true}).click();await shot('revisao-0'+(i+2));}assert.match(await card.innerText(),/Restrição retirada/);});
            report.push({device,name:'cadastro/login',status:'not-covered',reason:'A versão main inspecionada não possui telas de autenticação de conta; não confundir com senha demonstrativa Pix.'});
            await context.close();
           }
           await browser.close();fs.writeFileSync('screenshots/manifest.json',JSON.stringify({url,generatedAt:new Date().toISOString(),report},null,2));
           if(report.some(x=>x.status==='failed'))process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JUSTEC-capturas-academicas
          path: screenshots/
          retention-days: 30
