name: JUSTEC - Documentação Acadêmica
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Capture public screens
        run: |
          mkdir -p screenshots
          cat > capture.cjs <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            for (const [name, viewport] of Object.entries({mobile:{width:390,height:844},desktop:{width:1440,height:900}})) {
              const context = await browser.newContext({viewport, locale:'pt-BR', isMobile:name==='mobile', hasTouch:name==='mobile'});
              const page = await context.newPage();
              const url = 'https://justec-bank.vercel.app/';
              const response = await page.goto(url,{waitUntil:'domcontentloaded'});
              if (!response || !response.ok()) throw new Error('Site unavailable');
              await page.waitForTimeout(1500);
              await page.screenshot({path:'screenshots/'+name+'-01-inicio.png',fullPage:true});
              let i = 2;
              for (const label of ['Pix','Triagem','Pós-golpe','Direitos','Segurança','Tenho dúvida','Sofri um golpe','Ver extrato','Verificar chave Pix','Bloqueios preventivos','Contestações','Central de segurança','Entrar','Criar conta']) {
                await page.goto(url,{waitUntil:'domcontentloaded'});
                await page.waitForTimeout(600);
                const target = page.getByText(label,{exact:true}).first();
                if (await target.isVisible()) {
                  await target.click({timeout:3000}).catch(()=>{});
                  await page.waitForTimeout(700);
                  await page.screenshot({path:'screenshots/'+name+'-'+String(i++).padStart(2,'0')+'-'+label.replace(/[^a-zA-Z0-9]/g,'_')+'.png',fullPage:true});
                }
              }
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JUSTEC-capturas-academicas
          path: screenshots/
          retention-days: 30
