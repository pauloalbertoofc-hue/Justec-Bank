name: JUSTEC Preview Validation
on:
  push:
    branches: ['preview/redesign-banking']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - name: Test simulation invariants
        run: |
          node tests/state-invariants.cjs
          node --test tests/guard.test.mjs
      - name: Test responsive layout
        run: |
          python3 -m http.server 8000 >/tmp/justec-server.log 2>&1 &
          export CHROMIUM_PATH="$(node -e 'console.log(require("playwright").chromium.executablePath())')"
          node tests/layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-layout
          path: /tmp/justec-responsive-*.png
